<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1C2B44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cronograma">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Cronograma</title>
<style>
  :root{
    --paper:#E7E4D8; --paper-2:#F1EFE6; --card:#F5F3EB;
    --ink:#1C2B44; --ink-soft:#47536B; --muted:#6C6F63;
    --gold:#A97C1E; --gold-soft:#E7D5A2; --gold-line:#C9A24B;
    --crimson:#8A3A3A; --crimson-soft:#E7CFC7;
    --line:rgba(28,43,68,0.13); --line-strong:rgba(28,43,68,0.26);
    --shadow:0 1px 2px rgba(28,43,68,0.06), 0 8px 24px rgba(28,43,68,0.07);
    --display:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  .wrap{max-width:560px;margin:0 auto;padding:20px 18px 64px;}

  .ordo{display:flex;gap:6px;margin-bottom:22px;}
  .ordo-seg{flex:1;text-align:center;padding:7px 4px 8px;border:1px solid var(--line);
    border-radius:8px;background:var(--paper-2);font-family:var(--display);color:var(--ink-soft);
    transition:background .2s,border-color .2s,color .2s;}
  .ordo-seg .rom{font-size:15px;letter-spacing:.5px;line-height:1;}
  .ordo-seg .lbl{display:block;margin-top:4px;font-family:var(--sans);font-size:9px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .ordo-seg.sprint{background:#F3E9DF;border-color:var(--crimson-soft);}
  .ordo-seg.sprint .lbl{color:var(--crimson);}
  .ordo-seg.now{background:var(--ink);border-color:var(--ink);color:var(--gold-soft);box-shadow:var(--shadow);}
  .ordo-seg.now .lbl{color:var(--gold-line);}
  .ordo-seg.now.sprint{background:#3A2230;border-color:#3A2230;}

  .switch{display:flex;background:var(--paper-2);border:1px solid var(--line);
    border-radius:10px;padding:3px;margin-bottom:18px;}
  .switch button{flex:1;border:none;background:transparent;font-family:var(--sans);font-size:13px;
    font-weight:600;letter-spacing:.02em;color:var(--muted);padding:8px;border-radius:7px;cursor:pointer;transition:.15s;}
  .switch button.active{background:var(--ink);color:var(--paper);box-shadow:var(--shadow);}

  .plate-eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;}
  .plate-day{font-family:var(--display);font-size:40px;line-height:1.02;font-weight:600;letter-spacing:-.01em;margin:0 0 6px;}
  .plate-eixo{font-family:var(--display);font-style:italic;font-size:17px;color:var(--gold);margin:0 0 4px;}
  .plate-date{font-size:12.5px;color:var(--muted);margin-bottom:20px;}

  .anchor{display:flex;align-items:baseline;gap:10px;padding:11px 14px;margin-bottom:8px;
    background:var(--ink);color:var(--paper);border-radius:10px;}
  .anchor .t{font-family:var(--display);font-size:13px;font-weight:600;color:var(--gold-soft);white-space:nowrap;letter-spacing:.02em;}
  .anchor .n{font-size:13.5px;line-height:1.35;}

  .tasks{list-style:none;margin:14px 0 0;padding:0;}
  .task{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;margin-bottom:8px;
    background:var(--card);border:1px solid var(--line);border-radius:11px;cursor:pointer;transition:background .15s;}
  .task:active{background:#EFEDE2;}
  .box{flex:none;width:22px;height:22px;margin-top:1px;border:1.6px solid var(--line-strong);
    border-radius:6px;display:grid;place-items:center;transition:.15s;}
  .box svg{width:13px;height:13px;stroke:var(--paper);stroke-width:3;fill:none;stroke-linecap:round;
    stroke-linejoin:round;opacity:0;transform:scale(.6);transition:.15s;}
  .task.done .box{background:var(--gold);border-color:var(--gold);}
  .task.done .box svg{opacity:1;transform:scale(1);}
  .task-body{flex:1;min-width:0;}
  .task-title{font-size:15px;font-weight:600;letter-spacing:.005em;}
  .task-note{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4;}
  .task.done .task-title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-strong);}
  .task.done .task-note{opacity:.7;}
  .task .tag{flex:none;align-self:center;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--gold);border:1px solid var(--gold-soft);padding:2px 7px;border-radius:20px;background:#F6EFDD;}

  .shead{font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);margin:30px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:baseline;}
  .shead .sub{font-family:var(--sans);font-size:11px;letter-spacing:0;text-transform:none;color:var(--muted);}

  .sprint-card{background:#F3E7DC;border:1px solid var(--crimson-soft);border-radius:12px;padding:15px 16px;margin-bottom:8px;}
  .sprint-card .lead{font-family:var(--display);font-style:italic;color:var(--crimson);font-size:15px;margin-bottom:9px;}
  .momento{display:flex;gap:11px;padding:8px 0;border-top:1px solid rgba(138,58,58,.16);}
  .momento:first-of-type{border-top:none;}
  .momento .m-n{font-family:var(--display);font-weight:700;color:var(--crimson);font-size:14px;flex:none;}
  .momento .m-t{font-size:13px;color:var(--ink);}
  .momento .m-t b{font-weight:600;}
  .momento .m-t span{display:block;font-size:11.5px;color:var(--muted);margin-top:1px;}

  .goal{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;margin-bottom:7px;
    background:var(--card);border:1px solid var(--line);border-radius:11px;}
  .goal .box{cursor:pointer;}
  .goal.done .box{background:var(--gold);border-color:var(--gold);}
  .goal.done .box svg{opacity:1;transform:scale(1);}
  .goal-text{flex:1;font-size:14px;line-height:1.4;outline:none;}
  .goal.done .goal-text{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-strong);}
  .del{flex:none;background:none;border:none;color:var(--line-strong);font-size:20px;line-height:1;padding:0 2px;cursor:pointer;}
  .del:active{color:var(--crimson);}
  .add-row{width:100%;padding:11px 14px;margin-top:2px;background:var(--paper-2);
    border:1px dashed var(--line-strong);border-radius:11px;color:var(--muted);
    font-family:var(--sans);font-size:13px;cursor:pointer;text-align:left;}
  .add-row:active{background:#EAE7DC;}

  /* Bloco técnico */
  .tecbloco{border:1px solid var(--line);border-radius:12px;margin:20px 0 0;background:var(--paper-2);overflow:hidden;}
  .tecbloco summary{list-style:none;cursor:pointer;padding:12px 15px;display:flex;flex-direction:column;gap:3px;}
  .tecbloco summary::-webkit-details-marker{display:none;}
  .tecbloco .tb-t{font-family:var(--display);font-size:15px;font-weight:600;color:var(--ink);letter-spacing:.02em;}
  .tecbloco .tb-t::before{content:"›";display:inline-block;margin-right:9px;color:var(--muted);transition:transform .18s;}
  .tecbloco[open] .tb-t::before{transform:rotate(90deg);}
  .tecbloco .tb-sub{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;padding-left:19px;}
  .tecbloco .tb-body{padding:0 13px 12px;}
  .proj{border:1px solid var(--line);border-radius:12px;background:var(--card);
    padding:11px 12px 8px;margin-bottom:9px;box-shadow:var(--shadow);}
  .proj.ativo{border-color:var(--gold-line);box-shadow:0 0 0 1px var(--gold-soft) inset, var(--shadow);}
  .proj-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .proj-name{flex:1;font-family:var(--display);font-size:15px;font-weight:600;color:var(--ink);outline:none;}
  .proj-prog{flex:none;font-size:11px;letter-spacing:.04em;color:var(--muted);
    background:var(--paper-2);border:1px solid var(--line);border-radius:20px;padding:2px 8px;}
  .proj.ativo .proj-prog{color:var(--gold);border-color:var(--gold-soft);}
  .add-sub{width:100%;text-align:left;background:none;border:none;color:var(--muted);
    font-family:var(--sans);font-size:12px;padding:6px 2px 2px 30px;cursor:pointer;}
  .add-sub:active{color:var(--ink-soft);}
  .sub{display:flex;align-items:flex-start;gap:10px;padding:7px 2px;
    border-top:1px solid var(--line);}
  .sub .st-dot{flex:none;width:18px;height:18px;margin-top:1px;border-radius:50%;
    border:2px solid var(--line-strong);cursor:pointer;transition:.15s;}
  .sub.st-1 .st-dot{border-color:var(--gold-line);
    background:linear-gradient(90deg,var(--gold) 50%,transparent 50%);}
  .sub.st-2 .st-dot{border-color:var(--gold);background:var(--gold);}
  .sub-text{flex:1;font-size:13.5px;line-height:1.4;color:var(--ink);outline:none;}
  .sub.st-1 .sub-text{color:var(--ink);font-weight:600;}
  .sub.st-2 .sub-text{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-strong);}

  .count{display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--paper);
    border-radius:12px;padding:15px 16px;margin-bottom:10px;}
  .count .num{font-family:var(--display);font-size:34px;font-weight:600;line-height:1;color:var(--gold-soft);min-width:44px;text-align:center;}
  .count .meta .c-t{font-size:14px;font-weight:600;}
  .count .meta .c-s{font-size:12px;color:#B9C0CE;margin-top:2px;}

  .ev{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:6px;
    background:var(--card);border:1px solid var(--line);border-radius:10px;}
  .ev .ev-d{font-family:var(--display);font-weight:700;color:var(--gold);font-size:14px;min-width:40px;text-align:center;flex:none;}
  .ev .ev-t{flex:1;font-size:13.5px;outline:none;min-width:0;}
  .ev input[type=date]{border:none;background:transparent;font-family:var(--sans);font-size:11px;color:var(--muted);width:112px;flex:none;}

  .wday{border:1px solid var(--line);border-radius:11px;margin-bottom:8px;background:var(--paper-2);overflow:hidden;}
  .wday summary{list-style:none;cursor:pointer;padding:13px 15px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .wday summary::-webkit-details-marker{display:none;}
  .wday .w-day{font-family:var(--display);font-size:17px;font-weight:600;}
  .wday .w-eixo{font-size:12px;color:var(--gold);font-style:italic;font-family:var(--display);text-align:right;}
  .wday[data-today="1"]{border-color:var(--gold-line);background:#F6EFDD;}
  .wday .w-body{padding:0 15px 13px;font-size:13px;color:var(--ink-soft);}
  .wday .w-body div{padding:4px 0;border-top:1px solid var(--line);}
  .wday .w-body div:first-child{border-top:none;}

  .rule{margin-top:14px;padding:13px 15px;border:1px solid var(--line);border-radius:11px;
    background:var(--paper-2);font-size:12.5px;color:var(--ink-soft);}
  .rule b{color:var(--ink);font-family:var(--display);}
  .rule s{color:var(--muted);}

  .foot{margin-top:34px;text-align:center;font-size:11px;color:var(--muted);letter-spacing:.03em;}
  .foot button{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:11px;cursor:pointer;font-family:var(--sans);margin:0 6px;line-height:2.2;}


  #ptr{position:fixed;top:0;left:0;right:0;text-align:center;padding:12px;font-size:12px;
    color:var(--muted);background:var(--paper-2);transform:translateY(-100%);transition:transform .15s;
    z-index:100;border-bottom:1px solid var(--line);letter-spacing:.03em;}
  #ptr.show{transform:translateY(0);}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px;}
  .toefl-fase{margin:2px 0 14px;padding:10px 14px;border:1px solid var(--gold-soft);
    background:#F6EFDD;border-radius:11px;font-size:12.5px;color:var(--ink-soft);}
  .toefl-fase b{font-family:var(--display);color:var(--gold);}
  .toefl-fase span{display:block;margin-top:2px;color:var(--muted);}
  .tguia{border:1px solid var(--gold-soft);border-radius:12px;margin:14px 0 0;background:#F6EFDD;overflow:hidden;}
  .tguia summary{list-style:none;cursor:pointer;padding:12px 15px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .tguia summary::-webkit-details-marker{display:none;}
  .tguia .g-t{font-family:var(--display);font-size:14px;font-weight:600;color:var(--gold);}
  .tguia .g-sub{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;white-space:nowrap;}
  .tguia .g-body{padding:0 15px 14px;}
  .tguia .g-meta{font-size:12.5px;color:var(--ink-soft);line-height:1.45;margin:0 0 8px;}
  .tguia .g-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid rgba(169,124,30,.18);cursor:pointer;}
  .tguia .g-item:first-of-type{border-top:none;}
  .tguia .g-item .box{width:20px;height:20px;margin-top:1px;}
  .tguia .g-item.on .box{background:var(--gold);border-color:var(--gold);}
  .tguia .g-item.on .box svg{opacity:1;transform:scale(1);}
  .tguia .g-x{font-size:13px;line-height:1.4;}
  .tguia .g-item.on .g-x{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-strong);}
  .tguia .g-links{margin-top:12px;display:flex;flex-direction:column;gap:6px;}
  .tguia .g-links a{font-size:12.5px;color:var(--ink);text-decoration:none;border:1px solid var(--gold-soft);
    background:var(--card);border-radius:9px;padding:9px 11px;}
  .tguia .g-links a:active{background:#EFEDE2;}
</style>
</head>
<body>
<div id="ptr">Puxe para atualizar</div>
<div class="wrap">
  <div class="ordo" id="ordo" aria-label="Fase do mês"></div>
  <div class="switch" role="tablist">
    <button id="tab-hoje" class="active" onclick="setView('hoje')" role="tab">Hoje</button>
    <button id="tab-semana" onclick="setView('semana')" role="tab">Semana</button>
  </div>
  <main id="view-hoje"></main>
  <main id="view-semana" hidden></main>
  <div class="foot">
    <span id="phase-note"></span><br>
    <button onclick="limparHoje()">Limpar o que marquei hoje</button><br>
    <button onclick="exportarDados()">Exportar backup</button>
    <button onclick="document.getElementById('importFile').click()">Importar backup</button>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importarDados(this)"><br>
    <span id="ver"></span>
  </div>
</div>

<script>
const APP_VERSION = "2026-07-18-05";
const DIAS = {
  1:{nome:"Segunda", eixo:"Abertura ministerial & planejamento", anchors:[],
     tasks:[
       {id:"seg-min", t:"Manutenção ministerial", n:"Pendências da igreja, mensagens, o que ficou aberto"},
       {id:"seg-plan", t:"Planejar a semana", n:"Definir a tarefa principal de cada dia antes que a semana comece", tag:"âncora"},
       {id:"seg-acad", t:"Produção acadêmica leve", n:"Reabrir o artigo, uma ideia, um parágrafo"}
     ], uber:"Cowork quando der, nas duas janelas (~6–7h e ~14h30)"},
  2:{nome:"Terça", eixo:"Internacionalização — produção", anchors:[],
     tasks:[
       {id:"ter-art", t:"Artigo: escrever e expandir", n:"Bloco principal do dia. Aumentar páginas do recorte ativo"},
       {id:"ter-pos", t:"Pós-doc", n:"Research statement, candidaturas, prazos"},
       {id:"ter-toefl", t:"TOEFL · Reading", n:"Bloco curto, fora do Uber. Drills cronometrados + revisar cada erro por tipo de questão (formato 2026)", tag:"pulverizado"}
     ], uber:"Cowork quando der. Na fase de sprint: Momento 1 da EBD aqui"},
  3:{nome:"Quarta", eixo:"Preparo Joel de Oliveira", anchors:[],
     tasks:[
       {id:"qua-aula", t:"Preparar aulas", n:"O preparo de quinta já cobre a sexta (as duas turmas são 3º ano)", tag:"exclusivo"},
       {id:"qua-aval", t:"Preparar e revisar avaliações", n:"Correções, provas, o que vence na semana"},
       {id:"qua-outras", t:"Revisar EM1 / EM2 se houver", n:"Só o que a semana pedir"},
       {id:"qua-toefl", t:"TOEFL · Listening", n:"Bloco curto. 1 set com notas ativas: ideia central, exemplos, atitude do falante, transições", tag:"pulverizado"}
     ], uber:"Cowork quando der."},
  4:{nome:"Quinta", eixo:"Aula no Joel de Oliveira",
     anchors:[{t:"7h–14h30", n:"Aula no C.E. Prof. Joel de Oliveira"}],
     tasks:[
       {id:"qui-rec", t:"Livre a partir das 16h", n:"Uber da tarde, descanso ou uma tarefa leve já definida"},
       {id:"qui-toefl", t:"TOEFL · Vocabulário + shadowing", n:"O bloco mais leve: Anki (Academic Word List) + 10 min de shadowing. Só se houver energia", tag:"pulverizado"}
     ], uber:"Só à tarde/noite (a manhã é aula). Cowork curto"},
  5:{nome:"Sexta", eixo:"Aula + escrita acadêmica",

       {id:"sex-esc", t:"Escrita acadêmica", n:"Na janela livre 11h30–15h00. O artigo é o dono do dia até sair", tag:"âncora"},
       {id:"sex-toefl", t:"TOEFL · Writing", n:"Bloco curto. 1 tarefa cronometrada, alternar Write an Email e Academic Discussion, depois autocorreção", tag:"pulverizado"}
     ], uber:"Depois das 15h. Cowork quando der"},
  6:{nome:"Sábado", eixo:"Consolidação, pós-doc & técnico", anchors:[], tecnico:true,
     tasks:[
       {id:"sab-agentes", t:"Processar o que os agentes trouxeram", n:"Chamadas de publicação, vagas de pós-doc e concursos da semana"},
       {id:"sab-consol", t:"Consolidar a semana", n:"O que andou, o que fica para a próxima"},
       {id:"sab-toefl", t:"TOEFL · Speaking + simulado", n:"Bloco maior. Gravar respostas e comparar com modelos. A cada 2–3 semanas, trocar por 1 simulado no formato 2026", tag:"pulverizado"}
     ], uber:"Cowork quando der, nas duas janelas"},
  0:{nome:"Domingo", eixo:"EBD, igreja & descanso",
     anchors:[{t:"9h00", n:"Escola Bíblica Dominical — IBFC"}],
     tasks:[
       {id:"dom-igreja", t:"Igreja", n:"Culto, ministério, presença"},
       {id:"dom-desc", t:"Descanso e planejamento leve", n:"Revisão curta da semana só se houver energia"}
     ], uber:"Descanso. Sem Uber, sem TOEFL"}
};
const ORDEM_SEMANA = [1,2,3,4,5,6,0];

const EVENTOS_DEFAULT = [{id:"e1", t:"Projeto Acolher — evento de casais", data:"2026-08-22"},{id:"e-toefl", t:"Prova TOEFL", data:"2026-11-30"}];
const METAS_DEFAULT = [
  {id:"m1", t:"Artigo \"Patriotismo Cristão\": ajustar e expandir páginas", done:false},
  {id:"m2", t:"Pós-doc: enviar 1 candidatura", done:false},
  {id:"m3", t:"Construir o agente de chamadas de publicação", done:false},
  {id:"m4", t:"Construir o agente de vagas e concursos", done:false},
  {id:"m5", t:"TOEFL: completar 1 simulado no formato 2026", done:false},
  {id:"m6", t:"TOEFL: subir Reading e Writing para 24+", done:false}
];
// Bloco técnico: projetos de médio/longo prazo. Estado persiste entre dias (chave sem data).
// Cada subtarefa tem st: 0=a fazer, 1=em andamento, 2=concluída.
const TECNICO_DEFAULT = [
  {id:"p1", t:"Sites", subs:[
    {id:"s11", t:"Revisar índex principal", st:0},
    {id:"s12", t:"Revisar cronograma", st:0},
    {id:"s13", t:"Revisar Joel de Oliveira", st:0},
    {id:"s14", t:"Criar novos", st:0}
  ]},
  {id:"p2", t:"Canais dark (YouTube)", subs:[
    {id:"s21", t:"Definir linha editorial do Canal 1", st:0},
    {id:"s22", t:"Primeiro roteiro-piloto", st:0}
  ]},
  {id:"p3", t:"Ordo App", subs:[
    {id:"s31", t:"Liberar espaço em disco (~15–20 GB livres)", st:0},
    {id:"s32", t:"Instalar ferramentas base (Node.js + pnpm) e criar a pasta", st:0},
    {id:"s33", t:"Criar contas gratuitas (GitHub, Supabase, Vercel)", st:0},
    {id:"s34", t:"Montar o esqueleto (Next.js) e publicar \"olá mundo\" no ar", st:0},

/* ---- Backup: exportar / importar todos os dados cron: ---- */
function coletarDados(){
  const d={};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k && k.indexOf("cron:")===0){ d[k]=localStorage.getItem(k); }
  }
  return d;
}
function exportarDados(){
  const payload={_app:"Cronograma", _versao:APP_VERSION, _data:new Date().toISOString(), dados:coletarDados()};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="cronograma-backup-"+ymd(new Date())+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function importarDados(input){
  const file=input.files && input.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=function(){
    try{
      const parsed=JSON.parse(reader.result);
      const dados=parsed && parsed.dados ? parsed.dados : parsed;
      const chaves=Object.keys(dados||{}).filter(k=>k.indexOf("cron:")===0);
      if(!chaves.length){ alert("Backup inválido: nenhum dado do Cronograma encontrado."); input.value=""; return; }
      if(!confirm("Importar "+chaves.length+" itens deste backup? As marcações atuais serão substituídas pelas do arquivo.")){ input.value=""; return; }
      chaves.forEach(k=>{ try{ localStorage.setItem(k, dados[k]); }catch(e){} });
      alert("Backup importado. O app vai recarregar.");
      location.reload();
    }catch(e){ alert("Não foi possível ler o arquivo: "+e.message); }
    input.value="";
  };
  reader.readAsText(file);
}


/* ---- Atualização automática + puxar para atualizar ---- */
function baseUrl(){return location.pathname;}
async function checkUpdate(){
  try{
    const res = await fetch(baseUrl()+"?ping="+Date.now(), {cache:"no-store"});
    const txt = await res.text();
    const m = txt.match(/APP_VERSION\s*=\s*"([^"]+)"/);
    if(m && m[1] !== APP_VERSION){ location.replace(baseUrl()+"?v="+m[1]); }
  }catch(e){/* sem rede: segue com a versão atual */}
}
(function pullToRefresh(){
  let startY=null, armed=false;
  const ptr=document.getElementById("ptr");
  window.addEventListener("touchstart",e=>{ startY = (window.scrollY<=0)? e.touches[0].clientY : null; },{passive:true});
  window.addEventListener("touchmove",e=>{
    if(startY===null || window.scrollY>0){return;}
    const dy=e.touches[0].clientY-startY;
    if(dy>70){ ptr.classList.add("show"); ptr.textContent="Solte para atualizar"; armed=true; }
    else{ ptr.classList.remove("show"); armed=false; }
  },{passive:true});
  window.addEventListener("touchend",()=>{
    if(armed){ ptr.textContent="Atualizando…"; location.replace(baseUrl()+"?v="+Date.now()); }
    startY=null; armed=false;
  });
})();
document.getElementById("ver").textContent = "v"+APP_VERSION;

/* Reset único do bloco técnico para a nova lista de 4 projetos.
   Roda uma só vez: grava a marca da seed e não sobrescreve edições futuras. */
const TEC_SEED = "2026-07-18-4projetos";
if(LS("cron:tecnico-seed", null) !== TEC_SEED){
  setTec(JSON.parse(JSON.stringify(TECNICO_DEFAULT)));
  save("cron:tecnico-seed", TEC_SEED);
}

renderOrdo(); renderHoje(); renderSemana();
checkUpdate();

</script>
