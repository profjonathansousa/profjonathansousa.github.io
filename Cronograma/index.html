<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1C2B44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cronograma">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Cronograma</title>
<style>
  :root{
    --paper:#E7E4D8; --paper-2:#F1EFE6; --card:#F5F3EB;
    --ink:#1C2B44; --ink-soft:#47536B; --muted:#6C6F63;
    --gold:#A97C1E; --gold-soft:#E7D5A2; --gold-line:#C9A24B;
    --crimson:#8A3A3A; --crimson-soft:#E7CFC7;
    --line:rgba(28,43,68,0.13); --line-strong:rgba(28,43,68,0.26);
    --shadow:0 1px 2px rgba(28,43,68,0.06), 0 8px 24px rgba(28,43,68,0.07);
    --display:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  .wrap{max-width:560px;margin:0 auto;padding:20px 18px 64px;}

  .ordo{display:flex;gap:6px;margin-bottom:22px;}
  .ordo-seg{flex:1;text-align:center;padding:7px 4px 8px;border:1px solid var(--line);
    border-radius:8px;background:var(--paper-2);font-family:var(--display);color:var(--ink-soft);
    transition:background .2s,border-color .2s,color .2s;}
  .ordo-seg .rom{font-size:15px;letter-spacing:.5px;line-height:1;}
  .ordo-seg .lbl{display:block;margin-top:4px;font-family:var(--sans);font-size:9px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .ordo-seg.sprint{background:#F3E9DF;border-color:var(--crimson-soft);}
  .ordo-seg.sprint .lbl{color:var(--crimson);}
  .ordo-seg.now{background:var(--ink);border-color:var(--ink);color:var(--gold-soft);box-shadow:var(--shadow);}
  .ordo-seg.now .lbl{color:var(--gold-line);}
  .ordo-seg.now.sprint{background:#3A2230;border-color:#3A2230;}

  .switch{display:flex;background:var(--paper-2);border:1px solid var(--line);
    border-radius:10px;padding:3px;margin-bottom:18px;}
  .switch button{flex:1;border:none;background:transparent;font-family:var(--sans);font-size:13px;
    font-weight:600;letter-spacing:.02em;color:var(--muted);padding:8px;border-radius:7px;cursor:pointer;transition:.15s;}
  .switch button.active{background:var(--ink);color:var(--paper);box-shadow:var(--shadow);}

  .plate-eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;}
  .plate-day{font-family:var(--display);font-size:40px;line-height:1.02;font-weight:600;letter-spacing:-.01em;margin:0 0 6px;}
  .plate-eixo{font-family:var(--display);font-style:italic;font-size:17px;color:var(--gold);margin:0 0 4px;}
  .plate-date{font-size:12.5px;color:var(--muted);margin-bottom:20px;}

  .anchor{display:flex;align-items:baseline;gap:10px;padding:11px 14px;margin-bottom:8px;
    background:var(--ink);color:var(--paper);border-radius:10px;}
  .anchor .t{font-family:var(--display);font-size:13px;font-weight:600;color:var(--gold-soft);white-space:nowrap;letter-spacing:.02em;}
  .anchor .n{font-size:13.5px;line-height:1.35;}

  .tasks{list-style:none;margin:14px 0 0;padding:0;}
  .task{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;margin-bottom:8px;
    background:var(--card);border:1px solid var(--line);border-radius:11px;cursor:pointer;transition:background .15s;}
  .task:active{background:#EFEDE2;}
  .box{flex:none;width:22px;height:22px;margin-top:1px;border:1.6px solid var(--line-strong);
    border-radius:6px;display:grid;place-items:center;transition:.15s;}
  .box svg{width:13px;height:13px;stroke:var(--paper);stroke-width:3;fill:none;stroke-linecap:round;
    stroke-linejoin:round;opacity:0;transform:scale(.6);transition:.15s;}
  .task.done .box{background:var(--gold);border-color:var(--gold);}
  .task.done .box svg{opacity:1;transform:scale(1);}
  .task-body{flex:1;min-width:0;}
  .task-title{font-size:15px;font-weight:600;letter-spacing:.005em;}
  .task-note{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4;}
  .task.done .task-title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-strong);}
  .task.done .task-note{opacity:.7;}
  .task .tag{flex:none;align-self:center;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--gold);border:1px solid var(--gold-soft);padding:2px 7px;border-radius:20px;background:#F6EFDD;}

  .shead{font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);margin:30px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:baseline;}
  .shead .sub{font-family:var(--sans);font-size:11px;letter-spacing:0;text-transform:none;color:var(--muted);}

  .sprint-card{background:#F3E7DC;border:1px solid var(--crimson-soft);border-radius:12px;padding:15px 16px;margin-bottom:8px;}
  .sprint-card .lead{font-family:var(--display);font-style:italic;color:var(--crimson);font-size:15px;margin-bottom:9px;}
  .momento{display:flex;gap:11px;padding:8px 0;border-top:1px solid rgba(138,58,58,.16);}
  .momento:first-of-type{border-top:none;}
  .momento .m-n{font-family:var(--display);font-weight:700;color:var(--crimson);font-size:14px;flex:none;}
  .momento .m-t{font-size:13px;color:var(--ink);}
  .momento .m-t b{font-weight:600;}
  .momento .m-t span{display:block;font-size:11.5px;color:var(--muted);margin-top:1px;}

  .goal{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;margin-bottom:7px;
    background:var(--card);border:1px solid var(--line);border-radius:11px;}
  .goal .box{cursor:pointer;}
  .goal.done .box{background:var(--gold);border-color:var(--gold);}
  .goal.done .box svg{opacity:1;transform:scale(1);}
  .goal-text{flex:1;font-size:14px;line-height:1.4;outline:none;}
  .goal.done .goal-text{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-strong);}
  .del{flex:none;background:none;border:none;color:var(--line-strong);font-size:20px;line-height:1;padding:0 2px;cursor:pointer;}
  .del:active{color:var(--crimson);}
  .add-row{width:100%;padding:11px 14px;margin-top:2px;background:var(--paper-2);
    border:1px dashed var(--line-strong);border-radius:11px;color:var(--muted);
    font-family:var(--sans);font-size:13px;cursor:pointer;text-align:left;}
  .add-row:active{background:#EAE7DC;}

  .count{display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--paper);
    border-radius:12px;padding:15px 16px;margin-bottom:10px;}
  .count .num{font-family:var(--display);font-size:34px;font-weight:600;line-height:1;color:var(--gold-soft);min-width:44px;text-align:center;}
  .count .meta .c-t{font-size:14px;font-weight:600;}
  .count .meta .c-s{font-size:12px;color:#B9C0CE;margin-top:2px;}

  .ev{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:6px;
    background:var(--card);border:1px solid var(--line);border-radius:10px;}
  .ev .ev-d{font-family:var(--display);font-weight:700;color:var(--gold);font-size:14px;min-width:40px;text-align:center;flex:none;}
  .ev .ev-t{flex:1;font-size:13.5px;outline:none;min-width:0;}
  .ev input[type=date]{border:none;background:transparent;font-family:var(--sans);font-size:11px;color:var(--muted);width:112px;flex:none;}

  .wday{border:1px solid var(--line);border-radius:11px;margin-bottom:8px;background:var(--paper-2);overflow:hidden;}
  .wday summary{list-style:none;cursor:pointer;padding:13px 15px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .wday summary::-webkit-details-marker{display:none;}
  .wday .w-day{font-family:var(--display);font-size:17px;font-weight:600;}
  .wday .w-eixo{font-size:12px;color:var(--gold);font-style:italic;font-family:var(--display);text-align:right;}
  .wday[data-today="1"]{border-color:var(--gold-line);background:#F6EFDD;}
  .wday .w-body{padding:0 15px 13px;font-size:13px;color:var(--ink-soft);}
  .wday .w-body div{padding:4px 0;border-top:1px solid var(--line);}
  .wday .w-body div:first-child{border-top:none;}

  .rule{margin-top:14px;padding:13px 15px;border:1px solid var(--line);border-radius:11px;
    background:var(--paper-2);font-size:12.5px;color:var(--ink-soft);}
  .rule b{color:var(--ink);font-family:var(--display);}
  .rule s{color:var(--muted);}

  .foot{margin-top:34px;text-align:center;font-size:11px;color:var(--muted);letter-spacing:.03em;}
  .foot button{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:11px;cursor:pointer;font-family:var(--sans);}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="ordo" id="ordo" aria-label="Fase do mês"></div>
  <div class="switch" role="tablist">
    <button id="tab-hoje" class="active" onclick="setView('hoje')" role="tab">Hoje</button>
    <button id="tab-semana" onclick="setView('semana')" role="tab">Semana</button>
  </div>
  <main id="view-hoje"></main>
  <main id="view-semana" hidden></main>
  <div class="foot">
    <span id="phase-note"></span><br>
    <button onclick="limparHoje()">Limpar o que marquei hoje</button>
  </div>
</div>

<script>
const DIAS = {
  1:{nome:"Segunda", eixo:"Abertura ministerial & planejamento", anchors:[],
     tasks:[
       {id:"seg-min", t:"Manutenção ministerial", n:"Pendências da igreja, mensagens, o que ficou aberto"},
       {id:"seg-plan", t:"Planejar a semana", n:"Definir a tarefa principal de cada dia antes que a semana comece", tag:"âncora"},
       {id:"seg-acad", t:"Produção acadêmica leve", n:"Reabrir o artigo, uma ideia, um parágrafo"}
     ], uber:"Cowork quando der, nas duas janelas (~6–7h e ~14h30)"},
  2:{nome:"Terça", eixo:"Internacionalização — produção", anchors:[],
     tasks:[
       {id:"ter-art", t:"Artigo: escrever e expandir", n:"Bloco principal do dia. Aumentar páginas do recorte ativo"},
       {id:"ter-pos", t:"Pós-doc", n:"Research statement, candidaturas, prazos"},
       {id:"ter-toefl", t:"TOEFL", n:"Bloco curto, fora do Uber", tag:"pulverizado"}
     ], uber:"Cowork quando der. Na fase de sprint: Momento 1 da EBD aqui"},
  3:{nome:"Quarta", eixo:"Preparo Joel de Oliveira", anchors:[],
     tasks:[
       {id:"qua-aula", t:"Preparar aulas do 3º ano", n:"O preparo de quinta já cobre a sexta (as duas turmas são 3º ano)", tag:"exclusivo"},
       {id:"qua-aval", t:"Preparar e revisar avaliações", n:"Correções, provas, o que vence na semana"},
       {id:"qua-outras", t:"Revisar EM1 / EM2 se houver", n:"Só o que a semana pedir"},
       {id:"qua-toefl", t:"TOEFL", n:"Bloco curto", tag:"pulverizado"}
     ], uber:"Leve. Quarta é dia de preparo — não sobrecarregar"},
  4:{nome:"Quinta", eixo:"Aula no Joel de Oliveira",
     anchors:[{t:"7h–14h30", n:"Aula no C.E. Prof. Joel de Oliveira"}],
     tasks:[
       {id:"qui-rec", t:"Livre a partir das 16h", n:"Uber da tarde, descanso ou uma tarefa leve já definida"},
       {id:"qui-toefl", t:"TOEFL leve", n:"Se houver energia", tag:"pulverizado"}
     ], uber:"Só à tarde/noite (a manhã é aula). Cowork curto"},
  5:{nome:"Sexta", eixo:"Aula + escrita profunda",
     anchors:[{t:"7h–10h30", n:"Aula no Joel (3º ano) — preparada na quarta"}],
     tasks:[
       {id:"sex-esc", t:"Escrita acadêmica profunda", n:"Na janela livre 11h30–15h00. O artigo é o dono do dia até sair", tag:"âncora"},
       {id:"sex-toefl", t:"TOEFL", n:"Bloco curto", tag:"pulverizado"}
     ], uber:"Depois das 15h. Cowork quando der"},
  6:{nome:"Sábado", eixo:"Consolidação, pós-doc & técnico", anchors:[],
     tasks:[
       {id:"sab-agentes", t:"Processar o que os agentes trouxeram", n:"Chamadas de publicação, vagas de pós-doc e concursos da semana"},
       {id:"sab-tec", t:"Bloco técnico", n:"Sites, canais dark, Instituto — médio/longo prazo, sem urgência semanal"},
       {id:"sab-consol", t:"Consolidar a semana", n:"O que andou, o que fica para a próxima"},
       {id:"sab-toefl", t:"TOEFL — bloco maior", n:"O dia comporta mais tempo", tag:"pulverizado"}
     ], uber:"Cowork quando der, nas duas janelas"},
  0:{nome:"Domingo", eixo:"EBD, igreja & descanso",
     anchors:[{t:"9h00", n:"Escola Bíblica Dominical — IBFC"}],
     tasks:[
       {id:"dom-igreja", t:"Igreja", n:"Culto, ministério, presença"},
       {id:"dom-desc", t:"Descanso e planejamento leve", n:"Revisão curta da semana só se houver energia"}
     ], uber:"Descanso. Sem Uber, sem TOEFL"}
};
const ORDEM_SEMANA = [1,2,3,4,5,6,0];

const EVENTOS_DEFAULT = [{id:"e1", t:"Projeto Acolher — evento de casais", data:"2026-08-22"}];
const METAS_DEFAULT = [
  {id:"m1", t:"Artigo \"Patriotismo Cristão\": ajustar e expandir páginas", done:false},
  {id:"m2", t:"Pós-doc: enviar 1 candidatura", done:false},
  {id:"m3", t:"Construir o agente de chamadas de publicação", done:false},
  {id:"m4", t:"Construir o agente de vagas e concursos", done:false}
];

const now = new Date();
const todayIdx = now.getDay();
const dateKey = ymd(now);
const monthKey = now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");

function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function LS(k,def){try{const v=localStorage.getItem(k);return v===null?def:JSON.parse(v);}catch(e){return def;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

let checks = LS("cron:checks:"+dateKey, {});
function toggleCheck(id){checks[id]=!checks[id];save("cron:checks:"+dateKey,checks);renderHoje();}

function weekOfMonth(d){return Math.min(4, Math.ceil(d.getDate()/7));}
const wom = weekOfMonth(now);
const phase = wom<=2 ? "livre" : (wom===3 ? "ebd1" : "ebd2");

function renderOrdo(){
  const romans=["I","II","III","IV"], labels=["livre","livre","EBD","EBD"];
  document.getElementById("ordo").innerHTML = romans.map((r,i)=>{
    const wk=i+1, cls=["ordo-seg"];
    if(wk>=3) cls.push("sprint"); if(wk===wom) cls.push("now");
    return `<div class="${cls.join(' ')}"><span class="rom">${r}</span><span class="lbl">${labels[i]}</span></div>`;
  }).join("");
  const notes={
    livre:"Semanas I–II · produção livre: artigo, pós-doc, agentes, técnico, Acolher.",
    ebd1:"Semana III · sprint EBD acende — Momento 1 (Cowork).",
    ebd2:"Semana IV · sprint EBD — Momento 2: revisar e formatar o material do mês seguinte."
  };
  document.getElementById("phase-note").textContent=notes[phase];
}

function tag(t){return t?`<span class="tag">${t}</span>`:"";}
const CHK='<svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg>';

function renderHoje(){
  const d=DIAS[todayIdx];
  const dateStr=now.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
  let html="";
  html+=`<p class="plate-eyebrow">Hoje</p>`;
  html+=`<h1 class="plate-day">${d.nome}</h1>`;
  html+=`<p class="plate-eixo">${d.eixo}</p>`;
  html+=`<p class="plate-date">${dateStr.charAt(0).toUpperCase()+dateStr.slice(1)}</p>`;

  d.anchors.forEach(a=>{html+=`<div class="anchor"><span class="t">${a.t}</span><span class="n">${a.n}</span></div>`;});

  if(phase!=="livre"){
    html+=`<div class="sprint-card"><div class="lead">Sprint EBD — material do próximo mês</div>`;
    if(phase==="ebd1"){
      html+=`<div class="momento"><span class="m-n">1</span><span class="m-t"><b>Rodar o Cowork</b> para estruturar todo o material do mês seguinte.<span>Pode ser no Uber. Um dia dedicado.</span></span></div>`;
      html+=`<div class="momento"><span class="m-n">2</span><span class="m-t">Ler, avaliar, editar e formatar.<span>Chega na semana IV — bloco protegido, fora do Uber.</span></span></div>`;
    } else {
      html+=`<div class="momento"><span class="m-n">1</span><span class="m-t">Estrutura via Cowork <b>já feita</b> na semana III.</span></div>`;
      html+=`<div class="momento"><span class="m-n">2</span><span class="m-t"><b>Ler, avaliar, editar e formatar</b> plano de aula, material do aluno e texto base.<span>Deve sair pronto antes de virar o mês.</span></span></div>`;
    }
    html+=`</div>`;
  }

  html+=`<ul class="tasks">`;
  d.tasks.forEach(t=>{
    const done=!!checks[t.id];
    html+=`<li class="task ${done?'done':''}" onclick="toggleCheck('${t.id}')">
      <span class="box">${CHK}</span>
      <div class="task-body"><div class="task-title">${t.t}</div>${t.n?`<div class="task-note">${t.n}</div>`:""}</div>
      ${tag(t.tag)}</li>`;
  });
  html+=`</ul>`;
  html+=`<div class="rule"><b>No Uber:</b> ${d.uber}. <s>TOEFL no trajeto não funciona</s> — o TOEFL fica nos blocos curtos fora do carro.</div>`;

  html+=`<div class="shead">Metas do mês <span class="sub">${now.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}</span></div><div id="metas"></div>`;
  html+=`<div class="shead">Datas importantes</div><div id="eventos"></div>`;

  document.getElementById("view-hoje").innerHTML=html;
  renderMetas(); renderEventos();
}

function getMetas(){return LS("cron:metas:"+monthKey, JSON.parse(JSON.stringify(METAS_DEFAULT)));}
function setMetas(m){save("cron:metas:"+monthKey,m);}
function renderMetas(){
  const box=document.getElementById("metas"); if(!box)return;
  const metas=getMetas(); let h="";
  metas.forEach((m,i)=>{
    h+=`<div class="goal ${m.done?'done':''}">
      <span class="box" onclick="toggleMeta(${i})">${CHK}</span>
      <div class="goal-text" contenteditable="true" onblur="editMeta(${i},this.innerText)">${escapeHtml(m.t)}</div>
      <button class="del" onclick="delMeta(${i})" aria-label="Remover">&times;</button></div>`;
  });
  h+=`<button class="add-row" onclick="addMeta()">+ Nova meta do mês</button>`;
  box.innerHTML=h;
}
function toggleMeta(i){const m=getMetas();m[i].done=!m[i].done;setMetas(m);renderMetas();}
function editMeta(i,t){const m=getMetas();m[i].t=t.trim()||m[i].t;setMetas(m);}
function delMeta(i){const m=getMetas();m.splice(i,1);setMetas(m);renderMetas();}
function addMeta(){const m=getMetas();m.push({id:"m"+Date.now(),t:"",done:false});setMetas(m);renderMetas();
  const b=document.querySelectorAll("#metas .goal-text");if(b.length)b[b.length-1].focus();}

function getEventos(){return LS("cron:eventos", JSON.parse(JSON.stringify(EVENTOS_DEFAULT)));}
function setEventos(e){save("cron:eventos",e);}
function diasAte(iso){const [y,m,dd]=iso.split("-").map(Number);
  const t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  return Math.round((new Date(y,m-1,dd)-t0)/86400000);}
function fmtData(iso){const [y,m,dd]=iso.split("-").map(Number);
  return new Date(y,m-1,dd).toLocaleDateString("pt-BR",{day:"numeric",month:"long"});}
function renderEventos(){
  const box=document.getElementById("eventos"); if(!box)return;
  let evts=getEventos().slice().sort((a,b)=>a.data<b.data?-1:1);
  const futuros=evts.filter(e=>diasAte(e.data)>=0);
  let h="";
  if(futuros.length){
    const nx=futuros[0], d=diasAte(nx.data);
    h+=`<div class="count"><span class="num">${d}</span><div class="meta">
      <div class="c-t">${escapeHtml(nx.t)}</div>
      <div class="c-s">${fmtData(nx.data)} · faltam ${d} dia${d===1?"":"s"}</div></div></div>`;
  }
  evts.forEach((e,i)=>{
    const d=diasAte(e.data), badge = d<0 ? "—" : d;
    h+=`<div class="ev">
      <span class="ev-d">${badge}</span>
      <div class="ev-t" contenteditable="true" onblur="editEv(${i},this.innerText)">${escapeHtml(e.t)}</div>
      <input type="date" value="${e.data}" onchange="dateEv(${i},this.value)">
      <button class="del" onclick="delEv(${i})" aria-label="Remover">&times;</button></div>`;
  });
  h+=`<button class="add-row" onclick="addEv()">+ Nova data importante</button>`;
  box.innerHTML=h;
}
function sortedRef(i){return getEventos().slice().sort((a,b)=>a.data<b.data?-1:1)[i];}
function editEv(i,t){const ref=sortedRef(i);const e=getEventos();const j=e.findIndex(x=>x.id===ref.id);
  if(j>-1){e[j].t=t.trim()||e[j].t;setEventos(e);renderEventos();}}
function dateEv(i,v){const ref=sortedRef(i);const e=getEventos();const j=e.findIndex(x=>x.id===ref.id);
  if(j>-1&&v){e[j].data=v;setEventos(e);renderEventos();}}
function delEv(i){const ref=sortedRef(i);const e=getEventos().filter(x=>x.id!==ref.id);setEventos(e);renderEventos();}
function addEv(){const e=getEventos();e.push({id:"e"+Date.now(),t:"",data:ymd(now)});setEventos(e);renderEventos();}

function renderSemana(){
  let html=`<p class="plate-eyebrow">Visão geral</p><h1 class="plate-day" style="font-size:30px;margin-bottom:16px;">A semana</h1>`;
  ORDEM_SEMANA.forEach(idx=>{
    const d=DIAS[idx], isToday=idx===todayIdx?1:0, linhas=[];
    d.anchors.forEach(a=>linhas.push(`<b>${a.t}</b> — ${a.n}`));
    d.tasks.forEach(t=>linhas.push(t.t));
    html+=`<details class="wday" data-today="${isToday}" ${isToday?"open":""}>
      <summary><span class="w-day">${d.nome}${isToday?" · hoje":""}</span><span class="w-eixo">${d.eixo}</span></summary>
      <div class="w-body">${linhas.map(l=>`<div>${l}</div>`).join("")}</div></details>`;
  });
  document.getElementById("view-semana").innerHTML=html;
}

function escapeHtml(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function setView(v){const hoje=v==="hoje";
  document.getElementById("view-hoje").hidden=!hoje;
  document.getElementById("view-semana").hidden=hoje;
  document.getElementById("tab-hoje").classList.toggle("active",hoje);
  document.getElementById("tab-semana").classList.toggle("active",!hoje);}
function limparHoje(){checks={};save("cron:checks:"+dateKey,{});renderHoje();}

renderOrdo(); renderHoje(); renderSemana();
</script>
