name: Avisos do Cronograma

on:
  schedule:
    # TRÊS FAIXAS, EM HORA DE BRASÍLIA (Fase 9E). O cron do GitHub é UTC, e a
    # conversão é -3h; a última CRUZA A MEIA-NOITE, e é por isso que o emissor
    # calcula a data em America/Sao_Paulo e não com o relógio do runner.
    #
    #   13:00 UTC = 10:00 BRT   manhã   (e a de sempre: DEPOIS das 11:00 UTC da
    #                                    coleta semanal, para que às segundas o
    #                                    lote de vagas já esteja no repositório)
    #   18:00 UTC = 15:00 BRT   tarde
    #   00:30 UTC = 21:30 BRT do DIA ANTERIOR   noite
    #
    # O cron entra numa fila e costuma atrasar de dez a sessenta minutos; não
    # conte com pontualidade. Por isso a FAIXA do aviso sai da hora local real,
    # e não de qual destas linhas disparou.
    - cron: '0 13 * * *'
    - cron: '0 18 * * *'
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      hoje:
        description: 'Data a simular (aaaa-mm-dd). Vazio = hoje.'
        required: false
      faixa:
        description: 'Faixa a simular (manha, tarde, noite). Vazio = pela hora.'
        required: false
      seco:
        description: 'Só mostrar o que enviaria, sem enviar e sem gravar'
        type: boolean
        default: false

# Escreve scripts/estado_notificador.json de volta no repositório.
permissions:
  contents: write

# MESMO GRUPO DA DOBRA E DO COLETOR (Fase 9E). Este job dá `git push` no main, e
# até aqui não declarava concorrência nenhuma: com um disparo por dia a corrida
# com a dobra (que roda a cada 15 min) era improvável; com três, triplica. Push
# recusado = job vermelho = identidade não gravada = aviso repetido no dia
# seguinte. Esperar a dobra terminar custa segundos.
concurrency:
  group: escrita-no-main
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        working-directory: avisos
        run: npm install --no-audit --no-fund
      - name: Enviar
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VAPID_PUBLIC_KEY:  ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT:     ${{ secrets.VAPID_SUBJECT }}
          HOJE: ${{ inputs.hoje }}
          FAIXA: ${{ inputs.faixa }}
          SECO: ${{ inputs.seco && '1' || '' }}
        run: node avisos/enviar.mjs
      - name: Guardar o que ja foi avisado
        if: ${{ !inputs.seco }}
        run: |
          # So commita se a dedup mudou. A identidade gravada e o que impede o
          # mesmo lote de virar aviso duas vezes.
          if [ -n "$(git status --porcelain scripts/estado_notificador.json)" ]; then
            git config user.name  "avisos-do-cronograma"
            git config user.email "actions@users.noreply.github.com"
            git add scripts/estado_notificador.json
            git commit -m "avisos: identidades notificadas"
            git push
          else
            echo "nada novo a registrar."
          fi
