name: Avisos do Cronograma

# QUEM APERTA O BOTÃO É O SUPABASE. O pg_cron (sql/cron_avisos.sql) dispara
# este workflow por workflow_dispatch às 06:28, 12:58, 18:58 e 22:58 de
# Brasília, e o notificador descobre pela hora qual momento do resumo do dia
# está valendo. O `schedule` do GitHub atrasa de três a oito horas, e por isso
# ficou só como rede de segurança: uma vez por dia, para que vagas, chamadas e
# datas continuem saindo se o disparo do Supabase falhar (token vencido, por
# exemplo). Fora da janela de um momento, o resumo do dia não sai — chegar
# atrasado é pior do que não chegar.
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
    inputs:
      momento:
        description: 'manha, tarde, noite ou fim. Vazio = o que estiver na hora.'
        required: false
      hoje:
        description: 'Data a simular (aaaa-mm-dd). Vazio = hoje.'
        required: false
      seco:
        description: 'Só mostrar o que enviaria, sem enviar e sem gravar'
        type: boolean
        default: false

# SÓ LEITURA. O que já foi avisado mora no Supabase (cron_aviso_enviado); este
# job não escreve mais no repositório, e por isso não disputa o main com a
# coleta nem com a dobra.
permissions:
  contents: read

# Dois disparos colados (o do Supabase e a rede de segurança) rodam em fila: o
# segundo encontra o registro do primeiro e não repete o aviso.
concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: avisos/package-lock.json
      - name: Instalar dependencias
        working-directory: avisos
        run: npm ci --no-audit --no-fund
      - name: Enviar
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VAPID_PUBLIC_KEY:  ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT:     ${{ secrets.VAPID_SUBJECT }}
          MOMENTO: ${{ inputs.momento }}
          HOJE: ${{ inputs.hoje }}
          SECO: ${{ inputs.seco && '1' || '' }}
        run: node avisos/enviar.mjs
