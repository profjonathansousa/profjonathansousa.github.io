name: Testar Web Push

# Só manual. Serve para provar a ponta a ponta — inscrição, VAPID, service
# worker e aparelho — sem esperar o horário do aviso diário.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: avisos/package-lock.json
      - name: Instalar dependencias
        working-directory: avisos
        run: npm ci --no-audit --no-fund
      - name: Enviar um aviso de teste
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VAPID_PUBLIC_KEY:  ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT:     ${{ secrets.VAPID_SUBJECT }}
        run: node avisos/testar.mjs
