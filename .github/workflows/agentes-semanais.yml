name: Agentes semanais — VAGAS e CHAMADAS

on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agentes-semanais
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install --quiet requests

      - name: Coletar VAGAS
        id: vagas
        continue-on-error: true
        run: python scripts/coletor.py vagas

      - name: Coletar CHAMADAS
        id: chamadas
        if: always()
        continue-on-error: true
        run: python scripts/coletor.py chamadas

      - name: Gravar no repositorio
        if: always()
        run: |
          git config user.name  "agente-semanal"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dados eventos scripts/estado_coletor.json
          if git diff --staged --quiet; then
            echo "Nada mudou nesta rodada."
          else
            git commit -m "agentes: coleta de $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi

      - name: Falhar alto se algum coletor quebrou
        if: always()
        run: |
          echo "vagas=${{ steps.vagas.outcome }}  chamadas=${{ steps.chamadas.outcome }}"
          if [ "${{ steps.vagas.outcome }}" != "success" ] || [ "${{ steps.chamadas.outcome }}" != "success" ]; then
            echo "::error::Um dos coletores falhou. Veja os logs das etapas acima."
            exit 1
          fi
