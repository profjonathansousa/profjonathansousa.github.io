name: Conferir os Trilhos pelo artefato

# O QUE ESTE WORKFLOW E, DESDE 2026-10-13: o BOTAO DE CONFERENCIA. Ele so roda
# quando alguem aperta Run workflow — nao ha agendamento.
#
# A MARCACAO DO DIA A DIA NAO PASSA POR AQUI. No fim de cada etapa do pipeline,
# o Cowork chama a funcao do banco cron_pipeline_marcar pelo conector do
# Supabase, e a etapa aparece nos aparelhos no mesmo instante. Foi o desenho que
# o autor decidiu: a marcacao acontece quando ELE dispara o fluxo no Cowork, e
# nao numa rodada das 20h37 (que este workflow fazia ate 2026-10-12).
#
# PARA QUE SERVE ENTAO: varrer a pasta de producao inteira e marcar o que ficou
# para tras — uma janela que fechou sem a chamada, uma sessao que caiu no meio.
# A varredura e o derivar_do_pipeline.py, e cada marcacao dele passa pela MESMA
# funcao, com as mesmas recusas (prova estrela, etapa que nao esta ativa). Com
# "so conferir" marcado, ele so diz o que marcaria.
#
# NADA VAI PARA O REPOSITORIO. Ate 2026-10-12 este job gravava a trilha (os
# toques dobrados no Cronograma/estado.json) num commit no main. A copia publica
# do historico saiu a pedido do autor: o historico mora no cron_registro, que e
# privado. Por isso o job so le este repositorio (contents: read).
#
# O QUE ELE PRECISA: o segredo PRODUCAO_TOKEN, um token de LEITURA do
# repositorio profjonathansousa/06_PRODUCAO_COWORK, que e privado. Sem ele, o
# workflow avisa e nao roda. O passo a passo esta no Cronograma/README.md, em
# "A marcacao pelo artefato".
#
# O LOG E PUBLICO, porque o repositorio e. LOG_PUBLICO=1 faz o script trocar
# por <slug> todo slug que ele le da pasta de producao, e tira do log o titulo
# dos projetos.

on:
  workflow_dispatch:
    inputs:
      so_conferir:
        description: 'So conferir: dizer o que marcaria, sem marcar nada'
        type: boolean
        default: false

permissions:
  contents: read

# Duas conferencias ao mesmo tempo nao estragariam nada (a funcao trava a linha
# e responde "ja_estava" a segunda), mas tambem nao servem para nada.
concurrency:
  group: derivar-marcacao
  cancel-in-progress: false

jobs:
  derivar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Conferir o token da pasta de producao
        id: token
        env:
          PRODUCAO_TOKEN: ${{ secrets.PRODUCAO_TOKEN }}
        run: |
          if [ -z "$PRODUCAO_TOKEN" ]; then
            echo "::warning title=Conferencia desligada::Falta o segredo PRODUCAO_TOKEN (leitura de 06_PRODUCAO_COWORK). Nada foi conferido. Ver Cronograma/README.md, 'A marcacao pelo artefato'."
            echo "pronto=nao" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=sim" >> "$GITHUB_OUTPUT"
          fi

      - name: Baixar este repositorio
        if: steps.token.outputs.pronto == 'sim'
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # SO LEITURA, e sem guardar a credencial no disco.
      - name: Baixar a pasta de producao
        if: steps.token.outputs.pronto == 'sim'
        uses: actions/checkout@v5
        with:
          repository: profjonathansousa/06_PRODUCAO_COWORK
          token: ${{ secrets.PRODUCAO_TOKEN }}
          path: _producao
          persist-credentials: false

      - name: Preparar Python
        if: steps.token.outputs.pronto == 'sim'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Conferir e marcar
        if: steps.token.outputs.pronto == 'sim'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PASTA_PRODUCAO: ${{ github.workspace }}/_producao
          LOG_PUBLICO: '1'
          SO_CONFERIR: ${{ inputs.so_conferir }}
        run: |
          if [ "$SO_CONFERIR" = "true" ]; then
            python scripts/derivar_do_pipeline.py
          else
            python scripts/derivar_do_pipeline.py --aplicar
          fi
